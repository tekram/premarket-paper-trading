<!DOCTYPE html>
<html>
<head>
<title>Premarket Paper Trading</title>
<style>
body { font-family: system-ui; max-width: 900px; margin: 40px auto; padding: 0 20px; }
h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
table { border-collapse: collapse; width: 100%; margin: 20px 0; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background: #f5f5f5; }
.pos { color: green; } .neg { color: red; }
</style>
</head>
<body>
<h1>Premarket Paper Trading</h1>
<p>Paper trading the daily premarket brief setups. Fill at open, 8% stop / 15% target / 5-day max.</p>
<h2>Cumulative P&L</h2>
<div id="summary">Loading...</div>
<h2>Recent Trades</h2>
<div id="trades">Loading...</div>
<script>
fetch('data/trades/index.json').then(r => r.json()).then(d => {
  document.getElementById('summary').innerHTML = '<p>Total P&L: <b>' + d.total_pnl + '%</b> | Win rate: ' + d.win_rate + '% | Trades: ' + d.total_trades + '</p>';
  let h = '<table><tr><th>Date</th><th>Ticker</th><th>Side</th><th>Fill</th><th>Exit</th><th>P&L%</th></tr>';
  d.recent.forEach(t => {
    h += '<tr><td>' + t.date + '</td><td><b>' + t.ticker + '</b></td><td>' + t.side + '</td><td>' + t.fill + '</td><td>' + t.exit + '</td><td class="' + (t.pnl >= 0 ? 'pos' : 'neg') + '">' + t.pnl + '%</td></tr>';
  });
  document.getElementById('trades').innerHTML = h + '</table>';
}).catch(e => { document.getElementById('summary').innerHTML = 'No trades yet.'; document.getElementById('trades').innerHTML = ''; });
</script>
</body>
</html>
